name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_sales_test
          POSTGRES_USER: ecommerce_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_user -d ecommerce_sales_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ecommerce_user:ci_password@localhost:5433/ecommerce_sales_test
      POSTGRES_PASSWORD: ci_password
      RUN_POSTGRES_TESTS: "1"
      ARUNIKA_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check .
      - name: SQL validation
        run: python scripts/validate_sql.py
      - name: Generate clean exports from canonical sources
        run: python -m pipeline.validation.analysis
      - name: Clean data contract
        run: python scripts/check_clean_contract.py
      - name: Validate schema on PostgreSQL
        run: python scripts/validate_sql.py --database
      - name: Test migration chain and repeatability
        run: |
          alembic upgrade head
          alembic upgrade head
          alembic current
      - name: Run tests with coverage
        run: python -m pytest --cov=pipeline --cov=dashboard --cov-report=term-missing --cov-report=xml -q
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
      - name: Pre-commit validation
        run: pre-commit run --all-files
      - name: Validate container build
        run: docker build --tag arunika-sales-pipeline:ci .

  publish:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/arunika-sales-pipeline:latest
