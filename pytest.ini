[pytest]
testpaths = tests
markers =
    integration: tests that require a live PostgreSQL database
# Do not set a fixed ``--basetemp`` here.  In a OneDrive workspace a fixed
# directory can be recreated by the sync client between pytest's cleanup and
# creation steps, which causes WinError 183 before any test runs.  Pytest's
# default temporary-directory strategy uses a unique directory per run.
addopts = -ra -p no:cacheprovider
