[pytest]
testpaths = tests
markers =
    integration: tests that require a live PostgreSQL database
# Jangan tetapkan ``--basetemp`` yang statis di sini. Di ruang kerja OneDrive,
# klien sinkronisasi dapat membuat ulang folder di antara tahap pembersihan dan
# pembuatan pytest sehingga muncul WinError 183 sebelum tes berjalan. Strategi
# bawaan pytest menggunakan folder sementara unik untuk setiap run.
addopts = -ra -p no:cacheprovider
